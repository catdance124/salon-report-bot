drive:
  pdf_fetch_count: 14

notebooklm:
  notebook_title: "サロンレポート分析"
  keep_notebook: true
  extra_reference_urls_file: "extra_reference_urls.txt"
  flex_message:
    query: |
      直近の経営状況を分析し、以下のJSON形式のみで回答してください。JSON以外のテキストは含めないでください。

      {
        "summary": "対象期間の明示。\n全体的な経営状況の要約（150文字以内）",
        "metrics": [
          {"label": "サロン情報PV", "value": "具体的な数値や変化", "trend": "前期比の傾向（例: ↑+10%）"},
          {"label": "クーポンPV", "value": "具体的な数値や変化", "trend": "前期比の傾向（例: ↑+10%）"},
          {"label": "CVR", "value": "具体的な数値や変化", "trend": "前期比の傾向（例: ↑+10%）"},
          {"label": "ACR", "value": "具体的な数値や変化", "trend": "前期比の傾向（例: ↑+10%）"},
          {"label": "売上", "value": "具体的な数値や変化", "trend": "前期比の傾向（例: ↑+10%）"},
          {"label": "予約数", "value": "具体的な数値や変化", "trend": "前期比の傾向"},
          {"label": "客単価", "value": "具体的な数値や変化", "trend": "前期比の傾向"},
        ],
        "highlights": ["好調な点1", "好調な点2"],
        "improvements": ["改善が必要な点1", "改善が必要な点2", "改善が必要な点3"],
        "actions": ["今週から実践できる具体的な改善提案1", "改善提案2", "改善提案3"]
      }
  video:
    language: "ja"
    format: "EXPLAINER"
    style: "KAWAII"
    timeout_seconds: 3600
    instructions: |
      直近のサロン経営状況について、スタッフ全員がわかりやすいよう以下の内容を中心に説明してください。

      1. サロン情報PV・クーポンPV・CVR・ACR・売上・予約数・客単価などの主要指標の振り返りと、前週比・前月比のトレンド
      2. 好調だった点とその要因
      3. 改善が必要な課題とその背景（特にPVと予約数のギャップなど）
      4. 来週から実践できる具体的なアクションポイント（クーポン配置・訴求内容・画像変更など）

      専門用語はできるだけ噛み砕いて、現場スタッフが明日から動けるような言葉で伝えてください。
